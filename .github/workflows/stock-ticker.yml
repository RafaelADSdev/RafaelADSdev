name: Atualizar Stock Ticker

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stock-ticker.yml'
      - 'scripts/update_stock_ticker.py'

concurrency:
  group: profile-stock-ticker
  cancel-in-progress: false

jobs:
  atualizar:
    if: github.ref_name == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Instalar fontes e Pillow
        run: |
          if [ ! -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]; then
            sudo apt-get update
            sudo apt-get install -y fonts-dejavu-core
          fi
          python -m pip install --disable-pip-version-check --only-binary=:all: Pillow==13.0.0

      - name: Regenerar e publicar o gráfico e o mapa
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for tentativa in 1 2 3; do
            git fetch --no-tags origin main
            git switch --detach FETCH_HEAD
            python scripts/update_stock_ticker.py
            git add -- README.md assets/stock-ticker/{painel,mobile,volume,volume-mobile}.webp

            if git diff --cached --quiet; then
              echo 'O painel já está atualizado.'
              exit 0
            fi

            git commit -m 'chore: atualizar atividade do Stock Ticker'
            if git push origin HEAD:refs/heads/main; then
              exit 0
            fi
            echo "Falha ao publicar na tentativa $tentativa. Buscando a versão mais recente do perfil."
          done

          exit 1
