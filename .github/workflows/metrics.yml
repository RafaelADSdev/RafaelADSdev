name: GitHub Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: '37 9 * * 1'
  push:
    paths:
      - '.github/workflows/metrics.yml'

permissions:
  contents: write

concurrency:
  group: profile-metrics-${{ github.ref }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar painel de atividade
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ github.token }}
          user: ${{ github.repository_owner }}
          filename: assets/github-metrics.svg
          base: ''
          base_skip: 'yes'
          plugin_isocalendar: 'yes'
          plugin_isocalendar_duration: half-year
          config_timezone: America/Sao_Paulo
          plugins_errors_fatal: 'yes'
